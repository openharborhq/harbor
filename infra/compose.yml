# Local development + appliance deployment share this file; the appliance adds compose.prod.yml.
name: trustworthier

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustworthier
      POSTGRES_PASSWORD: trustworthier
      POSTGRES_DB: trustworthier
    # Spec §3.3: the data dir holds OCR plaintext and MUST live on the encrypted volume.
    volumes: ["${TW_DATA_DIR:-../data}/postgres:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${TW_PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustworthier"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal, edge]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes: ["${TW_DATA_DIR:-../data}/redis:/data"]
    ports: ["127.0.0.1:${TW_REDIS_PORT:-6379}:6379"]
    networks: [internal, edge]
    restart: unless-stopped

  # Spec §3.6: the only container that opens documents. No internet egress (internal network).
  worker:
    build: { context: .., dockerfile: infra/docker/worker.Dockerfile }
    environment:
      DATABASE_URL: postgres://trustworthier:trustworthier@postgres:5432/trustworthier
      REDIS_URL: redis://redis:6379
      TW_DATA_DIR: /data
      TW_KEK_FILE: /run/secrets/kek
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-deu+eng}
    volumes: ["${TW_DATA_DIR:-../data}/blobs:/data/blobs", "${TW_DATA_DIR:-../data}/tmp:/data/tmp"]
    secrets: [kek]
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources: { limits: { cpus: "${OCR_CPUS:-3}", memory: 3g } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  api:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgres://trustworthier:trustworthier@postgres:5432/trustworthier
      REDIS_URL: redis://redis:6379
      TW_DATA_DIR: /data
      TW_KEK_FILE: /run/secrets/kek
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    volumes: ["${TW_DATA_DIR:-../data}/blobs:/data/blobs", "${TW_DATA_DIR:-../data}/tmp:/data/tmp"]
    secrets: [kek]
    networks: [internal, edge]
    restart: unless-stopped
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
    networks: [edge]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

secrets:
  kek:
    file: ${TW_DATA_DIR:-../data}/secrets/kek

networks:
  # No route to the internet. Postgres, Redis, worker and api only.
  internal:
    internal: true
  edge: {}
