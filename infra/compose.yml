# Local development + appliance deployment share this file; the appliance adds compose.prod.yml.
name: harbor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
      POSTGRES_DB: harbor
    # Spec §3.3: the data dir holds OCR plaintext and MUST live on the encrypted volume.
    volumes: ["${HARBOR_DATA_DIR:-../data}/postgres:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${HARBOR_PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal, edge]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes: ["${HARBOR_DATA_DIR:-../data}/redis:/data"]
    ports: ["127.0.0.1:${HARBOR_REDIS_PORT:-6379}:6379"]
    networks: [internal, edge]
    restart: unless-stopped

  # Spec §3.6: the only container that opens documents. No internet egress (internal network).
  worker:
    build: { context: .., dockerfile: infra/docker/worker.Dockerfile }
    environment:
      DATABASE_URL: postgres://harbor:harbor@postgres:5432/harbor
      REDIS_URL: redis://redis:6379
      HARBOR_DATA_DIR: /data
      HARBOR_KEK_FILE: /run/secrets/kek
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-deu+eng}
    volumes: ["${HARBOR_DATA_DIR:-../data}/blobs:/data/blobs", "${HARBOR_DATA_DIR:-../data}/tmp:/data/tmp"]
    secrets: [kek]
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources: { limits: { cpus: "${OCR_CPUS:-3}", memory: 3g } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Spec §3.6/§5: the only processing container with a route out. Reads document_text, never blobs.
  mailfetch:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "dist/mailfetch.js"]
    environment:
      DATABASE_URL: postgres://harbor:harbor@postgres:5432/harbor
      REDIS_URL: redis://redis:6379
      HARBOR_DATA_DIR: /data
      HARBOR_KEK_FILE: /run/secrets/kek
      MAIL_SYNC_INTERVAL_SECONDS: ${MAIL_SYNC_INTERVAL_SECONDS:-300}
      # A self-hosted server or Proton Bridge with a private CA: mount it and point this at it.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    secrets: [kek]
    volumes: ["${HARBOR_DATA_DIR:-../data}/blobs:/data/blobs", "${HARBOR_DATA_DIR:-../data}/tmp:/data/tmp"]
    # edge because IMAP hosts are outside; it holds mail credentials and reaches nothing else (§3.6).
    networks: [internal, edge]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  suggester:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "dist/suggester.js"]
    environment:
      DATABASE_URL: postgres://harbor:harbor@postgres:5432/harbor
      REDIS_URL: redis://redis:6379
      HARBOR_DATA_DIR: /data
      HARBOR_KEK_FILE: /run/secrets/kek
      SUGGEST_PROVIDER: ${SUGGEST_PROVIDER:-none}
      SUGGEST_MODEL: ${SUGGEST_MODEL:-claude-opus-5}
      SUGGEST_BASE_URL: ${SUGGEST_BASE_URL:-}
      SUGGEST_SEND_PEOPLE: ${SUGGEST_SEND_PEOPLE:-true}
      SUGGEST_READER_LANGUAGE: ${SUGGEST_READER_LANGUAGE:-en}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUGGEST_API_KEY: ${SUGGEST_API_KEY:-}
    secrets: [kek]
    networks: [internal, edge]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  # Spec §3.4: nightly pg_dump + one restic snapshot of the dump and the blobs; monthly restore test.
  # The only container with restic and a route to the repository. Holds the restic password and
  # the KEK (the restore test decrypts a sample of blobs), never a mail credential.
  backup:
    build: { context: .., dockerfile: infra/docker/backup.Dockerfile }
    environment:
      DATABASE_URL: postgres://harbor:harbor@postgres:5432/harbor
      REDIS_URL: redis://redis:6379
      HARBOR_DATA_DIR: /data
      HARBOR_KEK_FILE: /run/secrets/kek
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      # Unset = "not configured", and Settings says so. /backup is the second-disk option below.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_RESTORE_TEST_DAY: ${BACKUP_RESTORE_TEST_DAY:-1}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-30}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_PRUNE: ${BACKUP_PRUNE:-true}
      # BACKUP_HOUR is in this zone.
      TZ: ${TZ:-UTC}
    volumes:
      - "${HARBOR_DATA_DIR:-../data}/blobs:/data/blobs"
      - "${HARBOR_DATA_DIR:-../data}/dumps:/data/dumps"
      - "${HARBOR_DATA_DIR:-../data}/tmp:/data/tmp"
      # A second disk or NAS mount for RESTIC_REPOSITORY=/backup. Unused with an offsite repository.
      - "${HARBOR_BACKUP_DIR:-../data/backup}:/backup"
    secrets: [kek, restic_password]
    # edge because the repository is offsite; it reaches nothing else.
    networks: [internal, edge]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  api:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgres://harbor:harbor@postgres:5432/harbor
      REDIS_URL: redis://redis:6379
      HARBOR_DATA_DIR: /data
      HARBOR_KEK_FILE: /run/secrets/kek
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # The doorman's own origin, which share links are built from. Never WEB_ORIGIN: the app and
      # the doorman must not share one, or the session cookie travels to the public path (§10.6).
      SHARE_ORIGIN: ${SHARE_ORIGIN:-http://localhost:4010}
    # /data/shares is where a sealed bundle lands; the doorman mounts the same path read-only.
    volumes:
      - "${HARBOR_DATA_DIR:-../data}/blobs:/data/blobs"
      - "${HARBOR_DATA_DIR:-../data}/tmp:/data/tmp"
      - "${HARBOR_DATA_DIR:-../data}/shares:/data/shares"
      - "${HARBOR_DATA_DIR:-../data}/share-state:/data/share-state"
    secrets: [kek]
    networks: [internal, edge]
    restart: unless-stopped
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
    networks: [edge]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

  # The doorman (spec §10.2, §10.6). The only container a stranger's browser can reach, and the
  # least capable one in the stack: no database, no Redis, no KEK, no secrets at all. It sees one
  # directory read-only and writes to one other. Its port stays on loopback here — publishing it
  # is what `harbor public enable` does, through Funnel on the share node, never a host port.
  share:
    build: { context: .., dockerfile: infra/docker/share.Dockerfile }
    environment:
      SHARE_PORT: 4010
      SHARE_DIR: /data/shares
      SHARE_STATE_DIR: /data/share-state
    volumes:
      - "${HARBOR_DATA_DIR:-../data}/shares:/data/shares:ro"
      - "${HARBOR_DATA_DIR:-../data}/share-state:/data/share-state"
    ports: ["127.0.0.1:${HARBOR_SHARE_PORT:-4010}:4010"]
    networks: [edge]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4010/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  kek:
    file: ${HARBOR_DATA_DIR:-../data}/secrets/kek
  # Generated by setup (or check-data-volume.sh) next to the KEK; printed in the same envelope.
  restic_password:
    file: ${HARBOR_DATA_DIR:-../data}/secrets/restic-password

networks:
  # No route to the internet. Postgres, Redis, worker and api only.
  internal:
    internal: true
  edge: {}
