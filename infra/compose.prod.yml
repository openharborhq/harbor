# Appliance overrides. Usage on the box:
#   docker compose --env-file /data/harbor.env -f compose.yml -f compose.prod.yml up -d
#
# Differences from the dev file:
#   - images come from the registry (built multi-arch by scripts/build-images.sh), not from source
#   - Postgres and Redis publish no host ports at all
#   - web is the only thing listening, and only on the tailnet address (HARBOR_BIND, e.g. 100.x.y.z)
#   - $HARBOR_DATA_DIR must be the LUKS-backed mount (checked by check-data-volume.sh before `up`)
name: harbor

services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  worker:
    image: ${HARBOR_IMAGE_PREFIX:-ghcr.io/openharborhq/harbor}-worker:${HARBOR_IMAGE_TAG:-v0.1.0}
    build: !reset null
  mailfetch:
    image: ${HARBOR_IMAGE_PREFIX:-ghcr.io/openharborhq/harbor}-api:${HARBOR_IMAGE_TAG:-v0.1.0}
    build: !reset null
  suggester:
    image: ${HARBOR_IMAGE_PREFIX:-ghcr.io/openharborhq/harbor}-api:${HARBOR_IMAGE_TAG:-v0.1.0}
    build: !reset null
  backup:
    image: ${HARBOR_IMAGE_PREFIX:-ghcr.io/openharborhq/harbor}-backup:${HARBOR_IMAGE_TAG:-v0.1.0}
    build: !reset null
  api:
    image: ${HARBOR_IMAGE_PREFIX:-ghcr.io/openharborhq/harbor}-api:${HARBOR_IMAGE_TAG:-v0.1.0}
    build: !reset null
    ports: !reset []
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN}
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
  web:
    image: ${HARBOR_IMAGE_PREFIX:-ghcr.io/openharborhq/harbor}-web:${HARBOR_IMAGE_TAG:-v0.1.0}
    build: !reset null
    # !override, not !reset: reset removes the attribute and ignores what follows it, so this
    # line published nothing and the appliance would have had no web port at all — found the
    # first time the stack ran from images. The !reset [] lines above are correct: they remove.
    # Defaults to loopback, not to every interface: forgetting HARBOR_BIND should make the vault
    # unreachable from elsewhere, never accidentally reachable from the LAN. A default is also
    # what lets compose.tailscale.yml drop the port entirely — interpolation happens before
    # overrides, so a `?required` here would fail even when nothing publishes a port.
    ports: !override ["${HARBOR_BIND:-127.0.0.1}:${HARBOR_WEB_PORT:-3000}:3000"]
