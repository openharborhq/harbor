# The share node (spec §10.6) — added to the stack only by `harbor public enable`.
#
#   docker compose … -f compose.yml -f compose.share-funnel.yml up -d share tailscale-share
#
# Its own file rather than a service inside compose.tailscale.yml, for two reasons. The share node
# is independent of the app's node: it is a separate machine in the tailnet, on its own hostname,
# and only it ever gets Funnel — the app's node keeps `AllowFunnel: {}` empty for good, so no
# mistake here can publish the vault. And bundling them meant neither could be started without the
# other, which made this impossible to try out locally without also publishing the app.
name: harbor

services:
  # The share node (spec §10.6). Its own machine in the tailnet, so the doorman answers on its own
  # hostname at 443 — a separate origin from the app, and the only port a recipient behind a
  # corporate firewall can be relied on to reach.
  #
  # Only this node ever gets Funnel. The app's node above keeps `AllowFunnel: {}` empty for good,
  # so no mistake here can publish the vault. Started by `harbor public enable`, which is what the
  # profile is for: an install that never shares never grows a second node.
  tailscale-share:
    image: tailscale/tailscale:v1.102.3
    hostname: ${TAILSCALE_SHARE_HOSTNAME:-harbor-share}
    environment:
      # No auth key by default: `harbor public enable` prints the login URL this container emits
      # and waits, so nothing has to be created in the admin console and pasted here. A key is
      # still honoured for scripted installs.
      TS_AUTHKEY: ${TS_SHARE_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---accept-routes=false}
    volumes:
      # Its own identity, kept across upgrades: losing it means a new node, a new name, and every
      # live share link dead.
      - "${HARBOR_DATA_DIR:-../data}/tailscale-share:/var/lib/tailscale"
      - "./tailscale-share-serve.json:/config/serve.json:ro"
    networks: [edge]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [share]
